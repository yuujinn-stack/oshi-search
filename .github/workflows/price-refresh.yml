# 価格の分割自動更新（価格更新専用モード。OpenAI は使わない・判定と掲載状態は変えない・新しい商品は追加しない）
#
# 安全のための設定:
# - 起動は手動（workflow_dispatch・書き込み権限のある人だけ）と、有効化後の schedule のみ。pull_request では起動しない
#   （フォークからの PR には Secrets も渡されない）。schedule は既定ブランチでのみ動く。
# - Secrets は Environment「price-refresh」に登録し、Environment の「Deployment branches」を main だけに制限する。
# - リポジトリ変数 PRICE_REFRESH_ENABLED（小規模テストが成功するまで設定しない）:
#     true 以外のあいだは、schedule の実行は何もせず終わり、手動実行の full（全件）も実行できない
#     （dry-run・manual-test〔人物2人まで〕・limited-full〔少人数の通常実行。10人・楽天API 400回まで〕だけ）。
#     緊急停止もこの変数を true 以外に戻す。
#     さらに止める場合は Actions 画面で workflow を Disable。
# - OPENAI_API_KEY は渡さない。ログは件数の要約だけ（scripts/price-refresh/run.ts）。
# - 使う外部 Action はコミットSHAで固定。checkout はトークンを保存しない。
name: price-refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run＝読み取りだけ（persons 空なら次の実行の人物・順番・見込み） / manual-test＝persons の人物だけ更新 / limited-full＝定期実行と同じ順番で max_persons 人まで（最大10人・API 400回） / full＝通常どおり'
        type: choice
        options: [dry-run, manual-test, limited-full, full]
        default: dry-run
      persons:
        description: '対象の人物（カンマ区切り・完全一致）。dry-run・manual-test で使う。空なら全員（manual-test では必須・2人まで）'
        default: ''
      budget_min:
        description: '1回の実行で作業を始めてよい時間（分）'
        default: '20'
      lookup_per_person:
        description: '1人あたりのコード指定の取得の上限'
        default: '60'
      max_persons:
        description: '1回に処理する人物の上限（limited-full は最大10。dry-run では予定を表示する人数）'
        default: '3'
      max_api_calls:
        description: '1回に使う楽天APIの回数の上限（既定400。limited-full は最大400、それ以外も最大800）'
        default: '400'
      min_interval_days:
        description: '人物ごとの最短更新間隔（日）'
        default: '3'
  # 段階的に開始：最初は1日4回（UTC 1,7,13,19時の37分＝JST 10:37・16:37・22:37・4:37）。安定を確認したら1日8回
  # （'37 1,4,7,10,13,16,19,22 * * *'＝3時間ごと）に増やす。1回の上限は人物30人・楽天API 400回・最短更新間隔3日・
  # 作業時間20分・コード指定60件（下の env の schedule の既定値）。
  # 既存の新規商品の発見（/api/cron/refresh、UTC 3時台）と重ならない時刻にしている（同じ人物を同時に更新すると自動停止の対象になるため）。
  # 実行するのはリポジトリ変数 PRICE_REFRESH_ENABLED が 'true' のときだけ（下の jobs.refresh.if）。緊急停止はこの変数を true 以外に戻す。
  schedule:
    - cron: '37 1,7,13,19 * * *'

concurrency:
  group: price-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    # schedule の実行はリポジトリ変数 PRICE_REFRESH_ENABLED が 'true' のときだけ（緊急停止スイッチ）
    if: github.event_name == 'workflow_dispatch' || vars.PRICE_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: price-refresh
    timeout-minutes: 45
    steps:
      # 小規模テストの成功前（PRICE_REFRESH_ENABLED が true でない）は全件更新を実行しない
      - name: 全件更新の許可の確認（limited-full は不要）
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && vars.PRICE_REFRESH_ENABLED != 'true'
        run: |
          echo "full（全件更新）は、小規模テストの成功後にリポジトリ変数 PRICE_REFRESH_ENABLED=true を設定するまで実行できません。"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: 価格の分割自動更新
        run: npx tsx scripts/price-refresh/run.ts
        env:
          DATABASE_URL: ${{ secrets.PRICE_REFRESH_DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          NEXT_PUBLIC_SITE_URL: https://oshi-search.jp
          # 入力値は環境変数として渡す（シェルに埋め込まない）
          PRICE_REFRESH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' && '1' || '' }}
          PRICE_REFRESH_PERSONS: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'dry-run' || inputs.mode == 'manual-test') && inputs.persons || '' }}
          PRICE_REFRESH_LIMITED: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'limited-full' && '1' || '' }}
          # 1回の上限と最短更新間隔（schedule の既定：人物30人・楽天API 400回・3日。429 の原因を確認するまで 400 から上げない）
          PRICE_REFRESH_MAX_PERSONS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_persons || '30' }}
          PRICE_REFRESH_MAX_API_CALLS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_api_calls || '400' }}
          PRICE_REFRESH_MIN_INTERVAL_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.min_interval_days || '3' }}
          PRICE_REFRESH_REQUIRE_PERSONS: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'manual-test' && '1' || '' }}
          PRICE_REFRESH_BUDGET_MIN: ${{ github.event_name == 'workflow_dispatch' && inputs.budget_min || '20' }}
          PRICE_REFRESH_LOOKUP_PER_PERSON: ${{ github.event_name == 'workflow_dispatch' && inputs.lookup_per_person || '60' }}
